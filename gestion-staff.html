<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Inicio</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav id="barra_navegacion">
        <a href="index_admin.html" class="nav-marca">
            <span id="logo_nav"></span>
            <span class="nav-nombre">Boutique</span>
        </a>
        <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <div class="nav-links">
            <a href="index_admin.html">Inicio</a>
            <a href="gestion-staff.html" class="activo">Gestión STAFF</a>
            <a href="gestion-productos.html">Gestión Productos</a>
        </div>
    </nav>

    <div id="contenedor_principal">
        <div class="hero-servicio">
            <h1>Gestión de Staff</h1>
            <p class="hero-tagline">Administrá los profesionales, sus especialidades y disponibilidad horaria</p>
        </div>

        <!-- Formulario para Crear / Editar -->
            <div class="reserva-card" style="max-width: 800px; margin: 0 auto 40px auto; background: #212021; padding: 40px; border-radius: 20px; border: 3px solid rgb(166, 92, 236); box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.4);">
                <h3 id="titulo-form-staff" style="color: rgb(246, 112, 181); margin-top: 0; margin-bottom: 25px; font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 26px;">Agregar Nuevo Profesional</h3>
                
                <form id="form-staff-crud">
                    <input type="hidden" id="modo-edicion" value="crear">
                    
                    <div style="margin-bottom: 20px;">
                        <label for="dnistaff" style="color: #fff; display: block; margin-bottom: 8px; font-size: 15px;">DNI:</label>
                        <input type="number" id="dnistaff" required style="width: 100%; padding: 12px; background: #1a191a; border: 2px solid rgb(137, 43, 226); color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 15px;">
                    </div>

                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <div style="flex: 1;">
                            <label for="nombre-staff" style="color: #fff; display: block; margin-bottom: 8px; font-size: 15px;">Nombre:</label>
                            <input type="text" id="nombre-staff" maxlength="20" required style="width: 100%; padding: 12px; background: #1a191a; border: 2px solid rgb(137, 43, 226); color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 15px;">
                        </div>
                        <div style="flex: 1;">
                            <label for="apellido-staff" style="color: #fff; display: block; margin-bottom: 8px; font-size: 15px;">Apellido:</label>
                            <input type="text" id="apellido-staff" maxlength="30" required style="width: 100%; padding: 12px; background: #1a191a; border: 2px solid rgb(137, 43, 226); color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 15px;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                        <div style="flex: 1;">
                            <label for="especialidad-staff" style="color: #fff; display: block; margin-bottom: 8px; font-size: 15px;">Especialidad:</label>
                            <input type="text" id="especialidad-staff" placeholder="Ej: Colorista / Manicura" required style="width: 100%; padding: 12px; background: #1a191a; border: 2px solid rgb(137, 43, 226); color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 15px;">
                        </div>
                        <div style="flex: 1;">
                            <label for="disponibilidad-staff" style="color: #fff; display: block; margin-bottom: 8px; font-size: 15px;">Disponibilidad Horaria:</label>
                            <input type="text" id="disponibilidad-staff" placeholder="Ej: Lun a Vie 9 a 17hs" required style="width: 100%; padding: 12px; background: #1a191a; border: 2px solid rgb(137, 43, 226); color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 15px;">
                        </div>
                    </div>

                    <div style="text-align: center; display: flex; gap: 15px; justify-content: center;">
                        <button type="submit" id="btn-guardar-staff" style="background: rgb(137, 43, 226); border: 2px solid rgb(166, 92, 236); color: #fff; padding: 12px 30px; border-radius: 20px; font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;">Guardar Profesional</button>
                        <button type="button" id="btn-cancelar-edicion" style="display: none; background: #555; border: 2px solid #777; color: #fff; padding: 12px 20px; border-radius: 20px; font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 16px; font-weight: bold; cursor: pointer;">Cancelar</button>
                    </div>
                </form>
                <p id="mensaje-staff" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
            </div>

        <!-- Tabla de Staff Registrado -->
        <div style="max-width: 900px; margin: 0 auto; overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; background: #212021; color: #fff; border-radius: 15px; overflow: hidden; border: 2px solid rgb(166, 92, 236);">
                <thead>
                    <tr style="background: rgb(137, 43, 226); text-align: left;">
                        <th style="padding: 12px;">DNI</th>
                        <th style="padding: 12px;">Nombre y Apellido</th>
                        <th style="padding: 12px;">Especialidad</th>
                        <th style="padding: 12px;">Disponibilidad</th>
                        <th style="padding: 12px;">Turno ID</th>
                        <th style="padding: 12px; text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-staff-body">
                    <!-- Se llena dinámicamente con JS -->
                </tbody>
            </table>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
